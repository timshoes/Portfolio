<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../img/favicon-64.png">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ruscella Immersive About page header</title>
<!-- The About page header from ruscellaimmersive.com (repo timshoes/RuscellaImmersive, about/index.html): the ghost
     light swinging behind the viewer, throwing window light and object shadows across the wall. Shown inside the
     Ruscella Immersive website case study; links open the real site. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F4F4F6; --ink:#333333; --ink-2:#5C5C5C; --rule:#E2E2E6;
  --gold:#FFC31A; --violet:#5B21B6; --purple:#1B0640; --night:#1A1A1A;
  --serif:"Bodoni Moda", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:#FFFFFF; color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px)}

.top{position:relative;z-index:20;background:#6B6B70}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:74px}
.top img{display:block;height:24px;width:auto}
.top ul{list-style:none;display:flex;gap:clamp(14px,2.4vw,32px);margin:0;padding:0;font-size:14px}
.top a{text-decoration:none;color:#FFFFFF;opacity:.82;transition:.2s}
.top a:hover,.top a[aria-current]{opacity:1;color:var(--gold)}
@media (max-width:760px){ .top ul{display:none} }

.intro{padding-top:clamp(60px,9vw,110px);padding-bottom:clamp(44px,6vw,72px)}
.intro h1{font-family:var(--serif);font-weight:800;font-style:italic;font-size:clamp(36.8px,5.89vw,71.76px);line-height:1.03;
  letter-spacing:-.015em;margin:0 0 24px;max-width:15ch;font-variation-settings:"opsz" 9}
.intro .lead{font-size:clamp(18px,1.7vw,21px);max-width:58ch;margin:0 0 16px}
.intro p{color:var(--ink-2);max-width:62ch;margin:0 0 14px}

section.block{border-top:1px solid var(--rule);padding-top:clamp(52px,7vw,92px);padding-bottom:clamp(52px,7vw,92px)}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(24.84px,2.94vw,34.96px);line-height:1.12;margin:0 0 30px;font-variation-settings:"opsz" 9}

/* beliefs */
.beliefs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,3.5vw,48px)}
@media (max-width:820px){ .beliefs{grid-template-columns:1fr} }
.beliefs li{border-top:2px solid var(--violet);padding-top:18px}
.beliefs b{display:block;font-family:var(--serif);font-style:italic;font-weight:800;font-size:clamp(19.32px,1.84vw,23px);line-height:1.2;margin-bottom:10px;font-variation-settings:"opsz" 9}
.beliefs p{margin:0;color:var(--ink-2);font-size:15.5px}

/* provenance */
.prov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){ .prov{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .prov{grid-template-columns:1fr} }
.prov div{background:var(--paper-2);border-radius:14px;padding:24px 22px}
.prov b{display:block;font-family:var(--serif);font-weight:700;font-size:17.48px;line-height:1.25;margin-bottom:8px;font-variation-settings:"opsz" 9}
.prov span{font-size:14.5px;color:var(--ink-2)}
.trusted{margin-top:clamp(36px,5vw,56px)}
.trusted p{font-size:14px;color:var(--ink-2);margin:0 0 14px}
.marks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px 40px;font-family:var(--serif);font-size:clamp(15.64px,1.56vw,19.32px);color:var(--ink);font-weight:600;font-variation-settings:"opsz" 9}

/* founders */
.lead-founder{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,5vw,64px);align-items:center;margin-bottom:clamp(44px,6vw,72px)}
@media (max-width:820px){ .lead-founder{grid-template-columns:1fr} }
.photo{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:radial-gradient(70% 55% at 62% 30%, #4B1E9E 0%, #230A52 45%, #10032A 100%);
  display:flex;align-items:flex-end;justify-content:center}
.photo span{font-size:12.5px;color:#FFFFFF;opacity:.72;padding:0 18px 18px;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.wide{aspect-ratio:16/9}
.photo.sq{aspect-ratio:1/1}
.name{font-family:var(--serif);font-weight:800;font-style:italic;font-size:clamp(25.76px,3.13vw,36.8px);line-height:1.1;margin:0 0 4px;font-variation-settings:"opsz" 9}
.title{font-size:14.5px;color:var(--violet);margin:0 0 18px}
.bio{color:var(--ink-2);margin:0 0 16px;max-width:58ch}
.more{display:inline-block;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);
  text-decoration-thickness:2px;text-underline-offset:4px}
.more:hover{color:var(--violet)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,56px)}
@media (max-width:760px){ .pair{grid-template-columns:1fr} }
.pair .person{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:22px;align-items:start}
@media (max-width:480px){ .pair .person{grid-template-columns:1fr} }
.pair .name{font-size:clamp(24px,2.4vw,30px)}

.close{border-top:1px solid var(--rule);padding-top:clamp(56px,8vw,96px);padding-bottom:clamp(56px,8vw,96px);text-align:center}
.close.shade{background:var(--paper-2);border-top:0}
.close h2{font-weight:700;font-style:italic;font-size:clamp(28px,4vw,46px);margin:0 0 14px}
.close p{color:var(--ink-2);max-width:48ch;margin:0 auto 26px}
.cta{display:inline-flex;align-items:center;min-height:50px;padding:0 22px;border-radius:12px;text-decoration:none;
  font-size:15px;font-weight:500;background:var(--gold);color:var(--night);transition:.2s}
.cta:hover{background:#FFD24D}


/* ---- shared site chrome ---- */
.top .menu{display:none;text-decoration:none;color:#FFFFFF;opacity:.82;font-size:14px;cursor:pointer;background:none;border:0;font-family:inherit}
.nav-toggle{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.nav-toggle:focus-visible ~ .menu{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:760px){
  .top .menu{display:inline-block}
  .nav-toggle:checked ~ .menu{opacity:1;color:var(--gold)}
  .nav-toggle:checked ~ ul{
    display:flex;flex-direction:column;position:fixed;top:74px;left:0;right:0;bottom:0;
    background:#6B6B70;margin:0;padding:28px clamp(20px,5vw,64px);gap:20px;z-index:40;
    overflow-y:auto;font-size:20px;
  }
}
.band{background:linear-gradient(180deg,#6B6B70 0%,#57575C 100%);color:#FFFFFF}
.band .intro h1{color:var(--gold)}
.band .intro p,.band .intro .lead{color:#FFFFFF}
.band .intro p:not(.lead){opacity:.86}
.band .jump a{border-color:rgba(255,255,255,.45);color:#FFFFFF}
.band .jump a:hover{border-color:var(--gold);background:var(--gold);color:#1A1A1A}
.band + .svc, .band + section.block{border-top:0}
.band + .projects{padding-top:clamp(48px,6vw,80px)}

/* ---- site footer (shared) ---- */
.sitefoot{background:#141414;color:#FFFFFF;font-family:var(--sans);font-size:14px;line-height:1.6;margin:0}
.sf-wrap{max-width:1200px;margin:0 auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px);box-sizing:border-box}
.sf-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px;padding-top:clamp(72px,10vw,120px);padding-bottom:clamp(56px,8vw,96px)}
.sf-name{margin:0 0 6px;font-family:var(--serif);font-weight:800;font-style:italic;font-size:23.92px;color:#FFFFFF;font-variation-settings:"opsz" 9}
.sf-tag{margin:0 0 22px;color:rgba(255,255,255,.72)}
.sf-contact{margin:0;color:rgba(255,255,255,.72)}
.sf-eyebrow{margin:0 0 18px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#FFC31A}
.sf-links ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(150px,auto));gap:14px 56px}
.sitefoot a{color:#FFFFFF;text-decoration:none;opacity:.82;transition:color .2s,opacity .2s}
.sitefoot a:hover,.sitefoot a:focus-visible{opacity:1;color:#FFC31A}
.sf-base{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  padding-top:24px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:13px}
.sf-social{list-style:none;margin:0;padding:0;display:flex;gap:18px}
.sf-social a{display:inline-flex;width:22px;height:22px}
.sf-social svg{width:100%;height:100%;fill:currentColor}
@media (max-width:640px){ .sf-top{flex-direction:column} .sf-links ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px} }

/* ---- house lights: pages dim up on arrival, dim down on leaving ---- */
.houselights{position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;opacity:1;animation:hlUp .75s ease-out .05s forwards}
@keyframes hlUp{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.houselights{display:none}}

/* ---- logo wall: each tile shows the name until a logo file is dropped in ----
   To swap in a logo:  <li class="logo"><img src="/assets/logos/apple.svg" alt="Apple"></li>  */
.logos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.logos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.logos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.logos .logo{display:flex;align-items:center;justify-content:center;text-align:center;min-height:96px;padding:18px;border-radius:12px;background:#F4F4F6;
  font-family:var(--serif);font-size:14.72px;line-height:1.25;color:#333333;font-weight:600;font-variation-settings:"opsz" 9}
.logos .logo img{max-width:100%;max-height:48px;width:auto;height:auto;filter:grayscale(1);opacity:.75;transition:filter .3s,opacity .3s}
.logos .logo:hover img{filter:none;opacity:1}

/* ---- partners & collaborators ---- */
.partners-intro{color:var(--ink-2);max-width:58ch;margin:-14px 0 clamp(28px,4vw,40px)}
.sub-eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8A6500;margin:0 0 16px}
.people{list-style:none;margin:clamp(40px,5vw,56px) 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.person{display:flex;align-items:center;gap:16px;padding:18px;border-radius:14px;background:#F4F4F6}
.person .ph{flex:0 0 64px;width:64px;height:64px;border-radius:50%;overflow:hidden;background:#D9D9DE;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-style:italic;font-size:20.24px;color:#5C5C5C;font-weight:600;font-variation-settings:"opsz" 9}
.person .ph img{width:100%;height:100%;object-fit:cover}
.person b{display:block;font-family:var(--serif);font-weight:700;font-size:16.56px;line-height:1.2;font-variation-settings:"opsz" 9}
.person span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px}

/* About partner logos: white tiles, greyscale until hover (matches homepage) */
.partner-logos{grid-template-columns:repeat(5,minmax(0,1fr))}
.partner-logos .logo{background:#FFFFFF;border:1px solid #E2E2E6;min-height:118px;padding:20px}
.partner-logos .logo img{max-height:58px;max-width:84%}
.partner-logos .logo-text{font-family:var(--sans);font-weight:700;font-size:21px;letter-spacing:-.01em;color:#6B6B70}
.collaborators[hidden]{display:none}
@media (max-width:900px){.partner-logos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.partner-logos{grid-template-columns:repeat(2,minmax(0,1fr))}.partner-logos .logo{min-height:96px}}

/* ==== stage nav (interior pages): transparent over the header, like the homepage ==== */
.top{position:absolute;top:0;left:0;right:0;z-index:20;background:transparent}
.top .wrap{max-width:none;height:auto;padding:26px clamp(20px,5vw,64px)}
.top img{height:26px}
.top ul{gap:clamp(16px,2.6vw,36px);letter-spacing:.02em}
.top a{color:#F5CB49;opacity:1}
.top a:hover,.top a[aria-current]{color:#F6F1E4;opacity:1}
.top .menu{display:none;color:#F5CB49;opacity:1;letter-spacing:.02em;cursor:pointer;background:none;border:0;font:inherit;font-size:14px;text-decoration:none}
.nav-toggle{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.nav-toggle:focus-visible ~ .menu{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:760px){
  .top ul{display:none}
  .top .menu{display:inline-block}
  .nav-toggle:checked ~ .menu{color:var(--gold)}
  .nav-toggle:checked ~ ul{display:flex;flex-direction:column;position:fixed;top:78px;left:0;right:0;bottom:0;
    background:#212126;margin:0;padding:28px clamp(20px,5vw,64px);gap:20px;z-index:40;overflow-y:auto;font-size:20px}
  .nav-toggle:checked ~ ul a{color:#F6F1E4}
  .nav-toggle:checked ~ ul a:hover,.nav-toggle:checked ~ ul a[aria-current]{color:var(--gold)}
}

/* ==== ghost-light stage: a purple bulb behind the viewer, swaying;
        light falls through window panes onto a dark wall; objects cut into it ==== */
.gl-stage{position:relative;overflow:hidden;padding-top:78px;background:#212126}
.gl-stage > :not(.gl-light){position:relative;z-index:1}
.band .intro h1{color:var(--gold)}
.gl-light{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,#323138 0%,#212126 100%);--d:150px}
.gl-sway{animation:gl-swing 9s ease-in-out infinite alternate;will-change:transform}
@keyframes gl-swing{
  from{transform:translateX(calc(var(--dx) * -1)) skewX(calc(var(--sk) * -1))}
  to  {transform:translateX(var(--dx)) skewX(var(--sk))}}
/* bulb pool + faint wash: travel WITH the bulb */
.gl-wash,.gl-pool{position:absolute;border-radius:50%;mix-blend-mode:screen;--dx:calc(var(--d) * -0.8);--sk:0deg}
.gl-wash{width:2600px;height:2600px;left:calc(57% - 1300px);top:calc(46% - 1300px);
  background:radial-gradient(closest-side, rgba(139,69,255,.06), rgba(139,69,255,0))}
.gl-pool{width:950px;height:950px;left:calc(57% - 475px);top:calc(46% - 475px);
  background:radial-gradient(closest-side, rgba(139,69,255,.48), rgba(139,69,255,.24) 45%, rgba(139,69,255,0))}
/* window light + object shadows: travel AGAINST the bulb; nearer objects travel further */
.gl-layer{position:absolute;top:0;bottom:0;left:-200px;right:-200px}
.gl-layer svg{display:block;width:100%;height:100%}
.gl-panes{mix-blend-mode:screen;filter:blur(10px);--dx:var(--d);--sk:2.4deg}
.gl-objects{filter:blur(15px);opacity:.75;color:#17161B;--dx:calc(var(--d) * 1.54);--sk:4deg}
@media (max-width:760px){
  .gl-light{--d:70px}
  .gl-pool{width:620px;height:620px;left:calc(60% - 310px);top:calc(30% - 310px)}
}
@media (prefers-reduced-motion:reduce){ .gl-sway{animation:none} }
/* bodoni-fat merged */
/* ---- mobile nav: thumb-sized logo target (iOS) ---- */
header a.logo{display:inline-flex;align-items:center;padding:12px;margin:-12px;position:relative;z-index:2;-webkit-tap-highlight-color:transparent}
header a.logo img{pointer-events:none}

/* ---- mobile menu: three lines that turn into an X ---- */
:is(.nav,.top) .menu{align-items:center;justify-content:center;width:44px;height:44px;margin:-10px -10px -10px 0;padding:0;
  color:var(--gold,#FFC31A);opacity:1;font-size:0;-webkit-tap-highlight-color:transparent;position:relative;z-index:41}
:is(.nav,.top) .menu:focus-visible{outline:2px solid #FFC31A;outline-offset:2px;border-radius:8px}
:is(.nav,.top) .menu .bars{position:relative;display:block;width:24px;height:16px}
:is(.nav,.top) .menu .bars i{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:currentColor;
  transition:top .25s ease .15s,transform .25s ease,opacity .2s ease}
:is(.nav,.top) .menu .bars i:nth-child(1){top:0}
:is(.nav,.top) .menu .bars i:nth-child(2){top:7px}
:is(.nav,.top) .menu .bars i:nth-child(3){top:14px}
.nav-toggle:checked ~ .menu .bars i{transition:top .25s ease,transform .25s ease .15s,opacity .2s ease}
.nav-toggle:checked ~ .menu .bars i:nth-child(1){top:7px;transform:rotate(45deg)}
.nav-toggle:checked ~ .menu .bars i:nth-child(2){opacity:0}
.nav-toggle:checked ~ .menu .bars i:nth-child(3){top:7px;transform:rotate(-45deg)}
@media (max-width:760px){ :is(.nav,.top) .menu{display:inline-flex} }
html.menu-open,html.menu-open body{overflow:hidden}
@media (prefers-reduced-motion:reduce){ :is(.nav,.top) .menu .bars i{transition:none!important} }

/* portfolio embed: the About page header fills the frame */
html,body{height:100%;overflow:hidden}
.gl-stage{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>

<script>
/* mobile nav: close the menu after a tap, and when iPhone restores a page from history */
(() => {
  const t = document.getElementById('nav-toggle'), b = document.querySelector('header nav .menu');
  if (!t || !b) return;
  const set = open => {
    t.checked = open;
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.documentElement.classList.toggle('menu-open', open);
  };
  b.addEventListener('click', e => { e.stopPropagation(); set(!t.checked); if (t.checked){ const first = document.querySelector('#site-menu a'); first && first.focus({preventScroll:true}); } });
  document.querySelectorAll('#site-menu a').forEach(a => a.addEventListener('click', () => set(false)));
  addEventListener('keydown', e => { if (e.key === 'Escape' && t.checked){ set(false); b.focus(); } });
  addEventListener('pageshow', () => set(false));
  matchMedia('(min-width:761px)').addEventListener('change', e => { if (e.matches) set(false); });
})();
</script>
